name: Release
run-name: "发布 · ${{ github.event.workflow_run.display_title || format('手动发布 {0}', github.ref_name) }}"
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  publish:
    name: 构建与发布镜像
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: 检出项目源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY_USERNAME" || { echo 'Configure REGISTRY_USERNAME secret'; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'Configure REGISTRY_PASSWORD secret'; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo 'Only main may be released'; exit 1; }
      - name: 配置 Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify exact release source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm test
          npm run check
      - name: 配置多架构模拟器
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: 配置 Docker 构建器
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 登录镜像仓库
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.huangyut1ng.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Immutable image tag
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.huangyut1ng.com/typeflow:sha-${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: 记录部署镜像摘要
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "value=registry.huangyut1ng.com/typeflow@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Release summary
        env:
          IMAGE: ${{ steps.image.outputs.value }}
        run: |
          echo "Published image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: 部署生产环境
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: 检出项目源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy immutable image over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS APP_ORIGIN REGISTRY_USERNAME REGISTRY_PASSWORD; do
            test -n "${!variable}" || { echo "Missing $variable"; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$REGISTRY_USERNAME" =~ ^[a-zA-Z0-9_@.+-]+$ ]]
          [[ "$APP_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/typeflow/scripts'
          scp compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:typeflow/compose.yaml"
          scp scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:typeflow/scripts/deploy.sh"
          printf 'IMAGE=%s\nAPP_ORIGIN=%s\n' "$IMAGE" "$APP_ORIGIN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > ~/typeflow/.env'
          printf '%s' "$REGISTRY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login registry.huangyut1ng.com --username '$REGISTRY_USERNAME' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash ~/typeflow/scripts/deploy.sh'
          curl --fail --show-error --max-time 20 "$APP_ORIGIN/api/health"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
